name = "giolt"
version = "0.3.1"
description = "Build, run and deploy Gleam apps on Giolt"
internal_modules = ["giolt/internal", "giolt/internal/*"]
target = "javascript"
licences = ["GPL-3.0-or-later", "Apache-2.0"]
repository = { type = "github", user = "withgiolt", repo = "cli" }
links = [
    { title = "Website", href = "https://giolt.com" },
    { title = "Docs", href = "https://docs.giolt.com" }
]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
gleam_javascript = ">= 1.0.1 and < 2.0.0"
filepath = ">= 1.1.2 and < 2.0.0"
conversation = ">= 2.0.2 and < 3.0.0"
gleam_regexp = ">= 1.1.1 and < 2.0.0"
gleam_fetch = ">= 1.4.1 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
envie = ">= 1.2.0 and < 2.0.0"
clip = ">= 1.2.2 and < 2.0.0"
argv = ">= 1.1.0 and < 2.0.0"
tom = ">= 2.1.0 and < 3.0.0"
gleam_package_interface = ">= 4.0.0 and < 5.0.0"
glitzer = ">= 2.0.0 and < 3.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
